name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Show Python version
        shell: pwsh
        run: python --version

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests

      - name: Compile source and tests
        shell: pwsh
        run: python -m compileall -q src tests run_app.py run_worker.py run_migrations.py run_postgres_migrations.py run_smoke.py run_preflight.py run_health_report.py run_supervisor_check.py run_failed_task_export.py run_task_actions.py run_startup_check.py run_outbox.py run_protocol_validation.py run_sessions.py run_releases.py

      - name: Validate protocol parser fixtures
        shell: pwsh
        run: python .\run_protocol_validation.py --fixtures-only --json

      - name: Static smoke check frontend assets
        shell: pwsh
        run: |
          if (-not (Test-Path .\src\xingestion\web\static\index.html)) {
            throw "Missing frontend index.html"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Run live acquisition" -Quiet)) {
            throw "Frontend does not expose live acquisition action"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Metrics" -Quiet)) {
            throw "Frontend does not expose operational metrics"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Sessions" -Quiet)) {
            throw "Frontend does not expose session operations"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Last Error" -Quiet)) {
            throw "Frontend does not expose session diagnostics"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Needs Attention" -Quiet)) {
            throw "Frontend does not expose task action attention panel"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "data-investigate-task" -Quiet)) {
            throw "Frontend does not expose task investigation"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "/api/task-actions" -Quiet)) {
            throw "Frontend does not load task actions"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "data-export-task" -Quiet)) {
            throw "Frontend does not expose failed task export"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "/export" -Quiet)) {
            throw "Frontend does not call failed task export endpoint"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Support Exports" -Quiet)) {
            throw "Frontend does not expose support export listing"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "/api/support-exports" -Quiet)) {
            throw "Frontend does not load support exports"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "/api/startup" -Quiet)) {
            throw "Frontend does not load startup readiness"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "data-view-support-export" -Quiet)) {
            throw "Frontend does not expose support export detail view"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "data-download-support-export" -Quiet)) {
            throw "Frontend does not expose support export download"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "release risk" -Quiet)) {
            throw "Frontend does not expose release risk recommendations"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Outbox Recovery" -Quiet)) {
            throw "Frontend does not expose outbox recovery"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "/api/outbox/process" -Quiet)) {
            throw "Frontend does not call outbox process endpoint"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Protocol Validation" -Quiet)) {
            throw "Frontend does not expose protocol validation"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "/api/protocol-validation" -Quiet)) {
            throw "Frontend does not load protocol validation"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "/api/protocol-validation/run" -Quiet)) {
            throw "Frontend does not save protocol validation reports"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "secret backend" -Quiet)) {
            throw "Frontend does not expose secret backend status"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "/api/sessions/import" -Quiet)) {
            throw "Frontend does not expose session registry import"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Protocol Governance" -Quiet)) {
            throw "Frontend does not expose protocol release governance"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "/api/releases/approve" -Quiet)) {
            throw "Frontend does not expose release approval"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "formatPromotionSafety" -Quiet)) {
            throw "Frontend does not expose promotion safety"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "/api/releases/audits" -Quiet)) {
            throw "Frontend does not expose release promotion audits"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "/api/releases/audits/retention" -Quiet)) {
            throw "Frontend does not expose release promotion audit retention"
          }

      - name: Check deployment runbook
        shell: pwsh
        run: |
          if (-not (Test-Path .\docs\deployment_runbook.md)) {
            throw "Missing deployment runbook"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "docker compose up" -Quiet)) {
            throw "Deployment runbook must document starting Postgres/Redis via docker compose"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_dispatcher.py" -Quiet)) {
            throw "Deployment runbook must document the Redis Streams dispatcher"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_postgres_migrations.py" -Quiet)) {
            throw "Deployment runbook must document Postgres migrations"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_preflight.py" -Quiet)) {
            throw "Deployment runbook must document preflight"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_startup_check.py" -Quiet)) {
            throw "Deployment runbook must document startup check"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_health_report.py" -Quiet)) {
            throw "Deployment runbook must document health report export"
          }
          if (-not (Test-Path .\docs\process_supervision.md)) {
            throw "Missing process supervision guide"
          }
          if (-not (Select-String -Path .\docs\process_supervision.md -Pattern "run_supervisor_check.py" -Quiet)) {
            throw "Process supervision guide must document supervisor check"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_supervisor_check.py" -Quiet)) {
            throw "Deployment runbook must document supervisor check"
          }
          if (-not (Test-Path .\docs\logging.md)) {
            throw "Missing logging guide"
          }
          if (-not (Select-String -Path .\docs\logging.md -Pattern "XINGESTION_LOG_DIR" -Quiet)) {
            throw "Logging guide must document log directory configuration"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "XINGESTION_LOG_DIR" -Quiet)) {
            throw "Deployment runbook must document logging configuration"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_failed_task_export.py" -Quiet)) {
            throw "Deployment runbook must document failed task export"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "/api/support-exports" -Quiet)) {
            throw "Deployment runbook must document support export listing"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_task_actions.py" -Quiet)) {
            throw "Deployment runbook must document task action listing"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_outbox.py" -Quiet)) {
            throw "Deployment runbook must document outbox recovery"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_protocol_validation.py" -Quiet)) {
            throw "Deployment runbook must document protocol validation"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "XINGESTION_SECRET_PROVIDER" -Quiet)) {
            throw "Deployment runbook must document secret provider configuration"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "file:session-a" -Quiet)) {
            throw "Deployment runbook must document file-backed credential references"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "XINGESTION_SESSION_REGISTRY" -Quiet)) {
            throw "Deployment runbook must document session registry imports"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_sessions.py" -Quiet)) {
            throw "Deployment runbook must document session CLI"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_releases.py" -Quiet)) {
            throw "Deployment runbook must document release CLI"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "/api/releases/approve" -Quiet)) {
            throw "Deployment runbook must document release approval"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "promotion safety" -Quiet)) {
            throw "Deployment runbook must document promotion safety"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "release_promotions" -Quiet)) {
            throw "Deployment runbook must document promotion audit storage"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "prune-audits" -Quiet)) {
            throw "Deployment runbook must document promotion audit retention"
          }

  test-postgres-redis:
    name: Postgres/Redis task ledger (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xingestion
          POSTGRES_PASSWORD: xingestion
          POSTGRES_DB: xingestion
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U xingestion"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      XINGESTION_TEST_POSTGRES_DSN: postgresql://xingestion:xingestion@127.0.0.1:55432/xingestion
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Show Python version
        run: python --version

      - name: Run Postgres/Redis-backed tests
        run: |
          python -m unittest discover -s tests -p "test_postgres_task_ledger.py" -v
          python -m unittest discover -s tests -p "test_postgres_migration_runner.py" -v
          python -m unittest discover -s tests -p "test_local_worker.py" -v
          python -m unittest discover -s tests -p "test_operator_tasks.py" -v
          python -m unittest discover -s tests -p "test_reprocessing.py" -v
          python -m unittest discover -s tests -p "test_health_report.py" -v
          python -m unittest discover -s tests -p "test_support_export.py" -v
          python -m unittest discover -s tests -p "test_northbound_api.py" -v
          python -m unittest discover -s tests -p "test_preflight.py" -v
          python -m unittest discover -s tests -p "test_investigation.py" -v
          python -m unittest discover -s tests -p "test_outbox_operations.py" -v
