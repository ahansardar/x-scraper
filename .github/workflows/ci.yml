name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        shell: pwsh
        run: python --version

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests

      - name: Compile source and tests
        shell: pwsh
        run: python -m compileall -q src tests run_app.py run_worker.py run_migrations.py run_smoke.py run_preflight.py run_health_report.py run_supervisor_check.py run_failed_task_export.py run_task_actions.py

      - name: Static smoke check frontend assets
        shell: pwsh
        run: |
          if (-not (Test-Path .\src\xingestion\web\static\index.html)) {
            throw "Missing frontend index.html"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Run live acquisition" -Quiet)) {
            throw "Frontend does not expose live acquisition action"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Metrics" -Quiet)) {
            throw "Frontend does not expose operational metrics"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Sessions" -Quiet)) {
            throw "Frontend does not expose session operations"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Last Error" -Quiet)) {
            throw "Frontend does not expose session diagnostics"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\index.html -Pattern "Needs Attention" -Quiet)) {
            throw "Frontend does not expose task action attention panel"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "data-investigate-task" -Quiet)) {
            throw "Frontend does not expose task investigation"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "/api/task-actions" -Quiet)) {
            throw "Frontend does not load task actions"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "data-export-task" -Quiet)) {
            throw "Frontend does not expose failed task export"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "/export" -Quiet)) {
            throw "Frontend does not call failed task export endpoint"
          }
          if (-not (Select-String -Path .\src\xingestion\web\static\app.js -Pattern "release risk" -Quiet)) {
            throw "Frontend does not expose release risk recommendations"
          }

      - name: Check deployment runbook
        shell: pwsh
        run: |
          if (-not (Test-Path .\docs\deployment_runbook.md)) {
            throw "Missing deployment runbook"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "No-Docker|no-Docker|no-docker" -Quiet)) {
            throw "Deployment runbook must state the no-Docker deployment model"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_preflight.py" -Quiet)) {
            throw "Deployment runbook must document preflight"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_health_report.py" -Quiet)) {
            throw "Deployment runbook must document health report export"
          }
          if (-not (Test-Path .\docs\process_supervision.md)) {
            throw "Missing process supervision guide"
          }
          if (-not (Select-String -Path .\docs\process_supervision.md -Pattern "run_supervisor_check.py" -Quiet)) {
            throw "Process supervision guide must document supervisor check"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_supervisor_check.py" -Quiet)) {
            throw "Deployment runbook must document supervisor check"
          }
          if (-not (Test-Path .\docs\logging.md)) {
            throw "Missing logging guide"
          }
          if (-not (Select-String -Path .\docs\logging.md -Pattern "XINGESTION_LOG_DIR" -Quiet)) {
            throw "Logging guide must document log directory configuration"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "XINGESTION_LOG_DIR" -Quiet)) {
            throw "Deployment runbook must document logging configuration"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_failed_task_export.py" -Quiet)) {
            throw "Deployment runbook must document failed task export"
          }
          if (-not (Select-String -Path .\docs\deployment_runbook.md -Pattern "run_task_actions.py" -Quiet)) {
            throw "Deployment runbook must document task action listing"
          }
