<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X Ingestion Console</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">XINGESTIONV2 local live console</p>
        <h1>X Protocol Ingestion Console</h1>
      </div>
      <div class="status-pill" id="health">Checking</div>
    </header>

    <main class="layout">
      <section class="panel control-panel">
        <div class="section-title">
          <span class="mark"></span>
          <h2>Capability Request</h2>
        </div>
        <form id="searchForm">
          <label>
            Query
            <input name="query" value="india lang:en" autocomplete="off">
          </label>
          <div class="form-grid">
            <label>
              Product
              <select name="product">
                <option>Top</option>
                <option>Latest</option>
                <option>Photos</option>
                <option>Videos</option>
              </select>
            </label>
            <label>
              Page size
              <input name="page_size" type="number" min="1" max="50" value="20">
            </label>
          </div>
          <button type="submit">Run live acquisition</button>
        </form>
      </section>

      <section class="panel flow-panel">
        <div class="section-title">
          <span class="mark accent"></span>
          <h2>Execution Flow</h2>
        </div>
        <div class="flow">
          <div>Capability</div>
          <div>Plan</div>
          <div>X-rev</div>
          <div>Evidence</div>
          <div>Parsed Output</div>
        </div>
      </section>

      <section class="panel output-panel">
        <div class="section-title">
          <span class="mark success"></span>
          <h2>Latest Output</h2>
        </div>
        <div id="summary" class="summary">Run a live acquisition to produce output.</div>
        <div id="tweets" class="tweets"></div>
      </section>

      <section class="panel task-panel">
        <div class="section-title">
          <span class="mark neutral"></span>
          <h2>Task Ledger</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>Task</th>
              <th>Capability</th>
              <th>State</th>
            </tr>
          </thead>
          <tbody id="tasks"></tbody>
        </table>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
